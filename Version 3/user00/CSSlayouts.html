<!DOCTYPE html>
<html>
    <head>
        <style>
            main {
                border: 4px solid black;
            }
            p {
                border: 4px solid black;
            }
            ol {
                border: 12px solid black;
            }
            table, th, td, tr {
                border: 5px solid black;
            }
        </style>
    </head>
    <body>
    <h1>CSS Layouts</h1>
    <main>
        <p>Tables, Lists and Containers! <em>Oh my?!</em></p>
        <ol>
            <li>Tables</li>
            <li>Lists</li>
            <li>Containers</li>
        </ol>
        Before div...
        <div>
            This is a div container!
        </div>
        After div...
        Before span...
        <span>
            This is a span container!
        </span>
        After span...
        Before image...
        <img src="" aria-details="IMAGE">
        After image...
        <a href="">Link</a>
        <table>
            <tr>
                <th>
                    Headers
                </th>
                <th>
                    Tables
                </th>
                <th>
                    Lists
                </th>
                <th>
                    Containers
                </th>
            </tr>
            <tr>
                <td>Tables</td>
            </tr>
            <tr>
                <td>Lists</td>
            </tr>
            <tr>
                <td>Containers</td>
            </tr>
        </table>
    </main>
    </body>
</html>
