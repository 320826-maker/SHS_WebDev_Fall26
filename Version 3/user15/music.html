
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music</title>

    <link rel="stylesheet" href="CSS/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Georgia, serif;
            color: #E6E9FF;
        }

        .music-title {
            text-align: center;
            color: #DCE6FF;
            font-size: 42px;
            letter-spacing: 3px;
            margin-top: 45px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #AABCEB;
            font-style: italic;
            margin-bottom: 35px;
        }

        .music-table {
            width: 90%;
            max-width: 850px;
            margin: 0 auto 50px auto;
            border-collapse: collapse;
            background-color: rgba(20, 38, 75, 0.9);
            border-radius: 12px;
            overflow: hidden;
        }

        .music-table th {
            background-color: #243F70;
            color: white;
            padding: 16px;
            text-align: center;
            letter-spacing: 1px;
        }

        .music-table td {
            background-color: rgba(20, 38, 75, 0.9);
            color: #E6E9FF;
            padding: 14px;
            text-align: center;
            border: 1px solid #526B9E;
        }

        .music-table img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            color: #AABCEB;
            padding: 30px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #08152F;">
        <div class="container">
            <a class="navbar-brand" href="index.html">WebDev</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="aboutMe.html">About Me</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="music.html">Music</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="list.html">Lists</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Music Table -->
    <main>
        <h1 class="music-title">My Music ♡</h1>
        <p class="subtitle">songs that stay on repeat</p>

        <table class="music-table">
            <tr>
                <th>Album Cover</th>
                <th>Song</th>
                <th>Artist</th>
            </tr>

            <tr>
                <td><img src="images/mindfuk.jpg" alt="Mindfuk cover"></td>
                <td>Mindfuk</td>
                <td>Bella Kay</td>
            </tr>

            <tr>
                <td><img src="images/stillthinkaboutyou.jpg" alt="Still Think About You cover"></td>
                <td>Still Think About You</td>
                <td>A Boogie Wit da Hoodie</td>
            </tr>

            <tr>
                <td><img src="images/lookbackatit.jpg" alt="Look Back At It cover"></td>
                <td>Look Back At It</td>
                <td>A Boogie Wit da Hoodie</td>
            </tr>

            <tr>
                <td><img src="images/steady.jpg" alt="Steady cover"></td>
                <td>Steady</td>
                <td>Bella Kay</td>
            </tr>

            <tr>
                <td><img src="images/greatexpectation.jpg" alt="Great Expectation cover"></td>
                <td>Great Expectation</td>
                <td>Asienna Siepro</td>
            </tr>
        </table>
    </main>

    <footer>
        <p>Made by Tasneem Mohamed ♡</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
